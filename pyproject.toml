[project]
name = "hnids"
version = "0.1.0"
description = "Hybrid network intrusion detection: XGBoost OOF probabilities + BiGRU/Transformer sequence model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
ml = [
    "safetensors>=0.4",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "xgboost>=2.0",
]
serve = [
    "fastapi>=0.110",
    "prometheus-client>=0.20",
    "uvicorn>=0.29",
]

[project.scripts]
hnids = "hnids.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.7",
    "httpx>=0.27",
    "import-linter>=2.0",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "pip-audit>=2.7",
    "poethepoet>=0.26",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hnids"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "kaggle"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "S",    # bandit rules (incl. S301/S403 pickle bans)
    "T20",  # no print in production code
    "PTH",  # pathlib
    "ANN",  # annotations
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S603", "S607", "S108", "S311"]
"scripts/**" = ["T20", "S603", "S607"]
"kaggle/**" = ["T20", "S603", "S607", "PTH"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["xgboost.*", "sklearn.*", "safetensors.*", "prometheus_client.*", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: crosses module boundaries",
    "e2e: exercises the release path through the service",
    "ml: requires the ml extra (torch/xgboost)",
]
filterwarnings = ["error::DeprecationWarning:hnids.*"]

[tool.coverage.run]
source = ["hnids"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "hnids"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "(hnids.cli)",
    "(hnids.workflows)",
    "(hnids.serving)",
    "(hnids.bundle)",
    "(hnids.evaluation)",
    "(hnids.training)",
    "(hnids.models)",
    "(hnids.sequencing)",
    "(hnids.preprocessing)",
    "(hnids.splitting)",
    "(hnids.ingestion)",
    "hnids.reproducibility",
    "hnids.security",
    "hnids.config",
    "hnids.logging | hnids.errors",
]
exhaustive = false

# ---------------------------------------------------------------- tasks
[tool.poe.tasks]
fmt = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "mypy"
layers = "lint-imports"
test = "pytest --cov --cov-report=term-missing --cov-fail-under=90"
sec = "bandit -q -r src -c pyproject.toml"
audit = "pip-audit --skip-editable --progress-spinner off"
check = ["format-check", "lint", "typecheck", "layers", "test", "sec", "audit"]

[tool.bandit]
exclude_dirs = ["tests"]
